name: Python PR Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile preischeck.py test_preischeck.py flugalarm.py tests/test_flugalarm.py price_charts.py .github/scripts/verify_live.py price_failure_report_v1_0_0.py test_price_failure_report.py
      - name: Run offline unit tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run Thailand flight alert tests
        run: python -m unittest discover -s tests -p 'test_flugalarm.py' -v
