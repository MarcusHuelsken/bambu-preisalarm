name: Python PR Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'preischeck.py'
      - 'test_preischeck.py'
      - 'price_charts.py'
      - '.github/workflows/pr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile preischeck.py test_preischeck.py price_charts.py .github/scripts/verify_live.py
      - name: Run offline unit tests
        run: python -m unittest discover -p 'test_*.py' -v
